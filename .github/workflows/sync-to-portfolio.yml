name: Sync component to portfolio

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/components/**'
  workflow_dispatch:

# The cross-repo work is all done with PORTFOLIO_REPO_PAT; the default token
# needs nothing beyond reading this repo.
permissions:
  contents: read

# One sync PR at a time — concurrent runs would fight over the same branch.
concurrency:
  group: sync-to-portfolio
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repo
        uses: actions/checkout@v7
        with:
          path: package-health-checker

      - name: Check out portfolio repo
        uses: actions/checkout@v7
        with:
          repository: ShelbyKelley/portfolio-site
          token: ${{ secrets.PORTFOLIO_REPO_PAT }}
          path: portfolio-site

      # sync-manifest.txt is the source of truth for what ships — a file in
      # src/components/ that isn't listed there never syncs, even though the
      # trigger above watches the whole directory. Every top-level FILE in
      # the destination is wiped and recreated on every run, not just
      # overwritten: a rename or deletion here (e.g. Filters.jsx merged into
      # Constants.js) must remove the stale copy on the portfolio side too,
      # or it keeps importing names that no longer exist there and breaks
      # that repo's lint. This only removes files, never directories — the
      # portfolio repo keeps its own PackageHealthChecker/__tests__/ folder
      # for these components, following this repo's own __tests__
      # convention, and sync-manifest.txt only ever lists flat filenames
      # (never a path with a "/"), so the sync's scope was never anything
      # but these top-level files. A recursive `rm -rf` on the whole
      # directory would delete that test folder every single run.
      # The /g on the env-var rename matters: the component names
      # VITE_API_URL in more than one place (the read and the
      # misconfiguration message).
      - name: Copy the files listed in sync-manifest.txt, adjusting the env variable name
        run: |
          dest=portfolio-site/src/components/PackageHealthChecker
          mkdir -p "$dest"
          find "$dest" -maxdepth 1 -type f -delete
          src=package-health-checker/frontend/src/components
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            case "$name" in \#*) continue ;; esac
            sed 's/VITE_API_URL/VITE_PACKAGE_HEALTH_API_URL/g' "$src/$name" > "$dest/$name"
          done < "$src/sync-manifest.txt"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: portfolio-site/.nvmrc
          cache: 'npm'
          cache-dependency-path: portfolio-site/package-lock.json

      - name: Lint and format the copied files to match the portfolio's style
        working-directory: portfolio-site
        run: |
          npm ci
          npx eslint --fix src/components/PackageHealthChecker/*.jsx src/components/PackageHealthChecker/*.js
          npx prettier --write src/components/PackageHealthChecker/*.jsx src/components/PackageHealthChecker/*.js

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PORTFOLIO_REPO_PAT }}
          path: portfolio-site
          add-paths: |
            src/components/PackageHealthChecker/**
          commit-message: 'chore: sync package health checker components from source repo'
          title: 'Sync: package health checker component update'
          body: |
            Automatic sync from the [Package Health Checker repo](https://github.com/ShelbyKelley/package-health-checker) after a change to a file listed in `frontend/src/components/sync-manifest.txt`.

            Please review before merging — this was opened automatically.
          branch: sync/package-health-checker-tool
          base: main
