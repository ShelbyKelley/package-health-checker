name: Sync component to portfolio

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/components/PackageHealthChecker*.jsx'
      - 'frontend/src/components/PackageHealthChecker*.js'
  workflow_dispatch:

# The cross-repo work is all done with PORTFOLIO_REPO_PAT; the default token
# needs nothing beyond reading this repo.
permissions:
  contents: read

# One sync PR at a time — concurrent runs would fight over the same branch.
concurrency:
  group: sync-to-portfolio
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repo
        uses: actions/checkout@v7
        with:
          path: package-health-checker

      - name: Check out portfolio repo
        uses: actions/checkout@v7
        with:
          repository: ShelbyKelley/portfolio-site
          token: ${{ secrets.PORTFOLIO_REPO_PAT }}
          path: portfolio-site

      # The /g matters: the component names the env var in more than one
      # place (the read and the misconfiguration message), and without it
      # only the first mention per line would be renamed.
      - name: Copy component and its supporting files, adjusting env variable name
        run: |
          for f in package-health-checker/frontend/src/components/PackageHealthChecker*.jsx \
                   package-health-checker/frontend/src/components/PackageHealthChecker*.js; do
            [ -e "$f" ] || continue
            sed 's/VITE_API_URL/VITE_PACKAGE_HEALTH_API_URL/g' "$f" \
              > "portfolio-site/src/components/$(basename "$f")"
          done

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: portfolio-site/.nvmrc
          cache: 'npm'
          cache-dependency-path: portfolio-site/package-lock.json

      - name: Lint and format the copied files to match the portfolio's style
        working-directory: portfolio-site
        run: |
          npm ci
          npx eslint --fix src/components/PackageHealthChecker*.jsx src/components/PackageHealthChecker*.js
          npx prettier --write src/components/PackageHealthChecker*.jsx src/components/PackageHealthChecker*.js

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PORTFOLIO_REPO_PAT }}
          path: portfolio-site
          add-paths: |
            src/components/PackageHealthChecker*.jsx
            src/components/PackageHealthChecker*.js
          commit-message: 'chore: sync PackageHealthCheckerTool from source repo'
          title: 'Sync: PackageHealthCheckerTool update'
          body: |
            Automatic sync from the [Package Health Checker repo](https://github.com/ShelbyKelley/package-health-checker) after a change to the shared component or its supporting files.

            Please review before merging — this was opened automatically.
          branch: sync/package-health-checker-tool
          base: main
